<rect x="130" y="190" width="600" height="70" rx="10" fill="#cfe3f7"/>
<text x="430" y="212" font-weight="700" font-size="14">FOREST â€“ DAY 1  (one day = 120 seconds)</text>
<text x="430" y="233" font-size="12">Move W A S D Â· Look Mouse Â· Jump Space Â· Sprint Shift Â· Crouch Ctrl/C Â· Camera V</text>
<text x="430" y="250" font-size="12">Hotbar 1â€“9 Â· Inventory I Â· Craft B Â· Interact E Â· Drop G Â· Hide hints Tab Â· Pause Esc</text>

<rect x="25" y="290" width="810" height="70" rx="10" fill="#fbe3c2"/>
<text x="430" y="312" font-weight="700" font-size="14">SURVIVE â€“ watch the 4 meters (Health Â· Stamina Â· Hunger Â· Thirst, each starts at 100)</text>
<text x="430" y="333" font-size="12">Hunger drops 0.5 per second Â· Thirst drops 0.8 per second Â· Low thirst drains your health</text>
<text x="430" y="350" font-size="12">Refill by eating: Apple = +10 health, hunger, thirst Â· Meat = +20 each</text>

<g font-size="12" text-anchor="start">
<rect x="25" y="390" width="195" height="260" rx="10" fill="#d6efd2"/>
<text x="122" y="412" font-weight="700" font-size="14" text-anchor="middle">GATHER</text>
<text x="38" y="440">Apples: press E to pick</text>
<text x="38" y="458">Rocks &amp; logs on ground: E</text>
<text x="38" y="476">Trees: equip the Axe, then</text>
<text x="38" y="494">hold Left Mouse. 3 hits fells</text>
<text x="38" y="512">the tree and drops 3 logs</text>
<text x="38" y="540">I = inventory (drag &amp; drop)</text>
<text x="38" y="558">G = drop the held item</text>
<text x="38" y="586" font-weight="700">Day 1 needs:</text>
<text x="38" y="604">3 apples Â· 5 logs Â· 3 stones</text>

<rect x="230" y="390" width="195" height="260" rx="10" fill="#e6d9f3"/>
<text x="327" y="412" font-weight="700" font-size="14" text-anchor="middle">CRAFT  (press B)</text>
<text x="243" y="438">Pick a recipe â†’ Craft button</text>
<text x="243" y="462">Rock Barrier = 1 Rock</text>
<text x="243" y="480">Axe = 1 Log + 1 Rock</text>
<text x="243" y="498">Fishing Rod = 1 Log + 1 Reed</text>
<text x="243" y="516">Firewood = 1 Log</text>
<text x="243" y="534">Spear = 1 Log</text>
<text x="243" y="552">Bed = 1 Log</text>
<text x="243" y="570">Campfire = Firewood +</text>
<text x="243" y="588">  Rock Barrier</text>
<text x="243" y="616">Placing: aim, R rotates it</text>

<rect x="435" y="390" width="195" height="260" rx="10" fill="#cfe3f7"/>
<text x="532" y="412" font-weight="700" font-size="14" text-anchor="middle">FISH</text>
<text x="448" y="440">1. Craft a Fishing Rod</text>
<text x="448" y="462">2. Put it on the hotbar and</text>
<text x="448" y="480">   select it (1â€“9)</text>
<text x="448" y="502">3. Face the water, Left Mouse</text>
<text x="448" y="520">   casts the line (12â€“30 m)</text>
<text x="448" y="542">4. Wait 2â€“8 seconds</text>
<text x="448" y="564">5. â€œFISH BITES! REEL NOW!â€</text>
<text x="448" y="582">   click again to catch it</text>
<text x="448" y="610">Fish = food for hunger</text>

<rect x="640" y="390" width="195" height="260" rx="10" fill="#f6d4d4"/>
<text x="737" y="412" font-weight="700" font-size="14" text-anchor="middle">HUNT  (bear / boar)</text>
<text x="653" y="440">Craft + equip the Spear</text>
<text x="653" y="458">Hold Left Mouse to charge</text>
<text x="653" y="476">(full power in 1.5 s)</text>
<text x="653" y="494">Release to throw: 40 damage</text>
<text x="653" y="518">Animal has 100 HP, ~3 hits</text>
<text x="653" y="542" font-weight="700">Danger:</text>
<text x="653" y="560">they chase within 20 m and</text>
<text x="653" y="578">hit for 20 every 1.5 s</text>
<text x="653" y="602">Drops 2 Meat: +20 health,</text>
<text x="653" y="620">hunger and thirst each</text>
</g>

<rect x="25" y="680" width="810" height="60" rx="10" fill="#fff3b0"/>
<text x="430" y="703" font-weight="700" font-size="14">CAMPFIRE &amp; RECOVERY</text>
<text x="430" y="723" font-size="12">Place a crafted Campfire Â· stand within 3 m Â· hold E for 2 seconds to light it Â· eat Apples / Meat from the hotbar</text>

<path d="M430 770L580 820L430 870L280 820Z" fill="#fff3b0" stroke="#999"/>
<text x="430" y="816" font-weight="700">Day 1 tasks done?</text><text x="430" y="834" font-size="12">3 apples Â· 5 logs Â· 3 stones</text>
<text x="150" y="811" font-size="12" fill="#555">No â€“ go back to gathering</text>
<text x="442" y="890" font-size="12" text-anchor="start" fill="#555">Yes</text>

<rect x="280" y="900" width="300" height="40" rx="10" fill="#d6efd2"/><text x="430" y="925" font-weight="700">â€œDAY 1 TASKS COMPLETE!â€</text>
<rect x="25" y="960" width="810" height="205" rx="10" fill="#d9d9d9"/>
<text x="430" y="984" font-weight="700" font-size="14">PAUSE MENU – press Esc at any time while playing</text>
