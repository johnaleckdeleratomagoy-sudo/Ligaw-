<rect x="40" y="1018" width="182" height="82" rx="6" fill="#ffffff"/><text x="131" y="1040" font-weight="700" font-size="13">Resume</text><text x="131" y="1060">Unfreezes the game</text><text x="131" y="1076">Esc again does the same</text><text x="131" y="1092">→ back to playing</text>
<rect x="234" y="1018" width="182" height="82" rx="6" fill="#ffffff"/><text x="325" y="1040" font-weight="700" font-size="13">Settings</text><text x="325" y="1060">Audio volume page</text><text x="325" y="1076">Controls page (rebind keys)</text><text x="325" y="1092">Back / Esc → pause menu</text>
<rect x="428" y="1018" width="182" height="82" rx="6" fill="#ffffff"/><text x="519" y="1040" font-weight="700" font-size="13">Save Game</text><text x="519" y="1060">Saves your progress</text><text x="519" y="1076">Load it later with</text><text x="519" y="1092">Main Menu → Resume</text>
<rect x="622" y="1018" width="182" height="82" rx="6" fill="#ffffff"/><text x="713" y="1040" font-weight="700" font-size="13">Quit to Main Menu</text><text x="713" y="1060">Leaves the forest and</text><text x="713" y="1076">loads the Main Menu</text><text x="713" y="1092">(save first!)</text>
</g>
<text x="430" y="1125" font-size="12">Esc order: closes Settings first, then Resume. Rapid Esc presses are ignored</text>
<text x="430" y="1141" font-size="12">while the menu is still fading in or out.</text>
<text x="430" y="1157" font-size="12" fill="#555">Resume → back to the Forest  ·  Quit to Main Menu → back to the top of this chart</text>
