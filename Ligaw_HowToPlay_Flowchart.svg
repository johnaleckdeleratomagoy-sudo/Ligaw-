<svg viewBox="0 0 680 720" width="1020" height="1080" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
<rect width="680" height="720" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#888" stroke-width="1.5"/></marker></defs>
<g stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#ar)">
<path d="M340 56V80"/><path d="M340 144V170"/>
<path d="M340 214V232H130V250"/><path d="M340 214V250"/><path d="M340 214V232H550V250"/>
<path d="M130 380V395H340V410"/><path d="M340 380V410"/><path d="M550 380V395H340"/>
<path d="M340 460V500"/>
<path d="M230 540H15V315H30"/>
<path d="M340 580V610"/><path d="M340 650V672"/>
</g>
<g font-size="13" text-anchor="middle" fill="#1f1f1f">
<rect x="240" y="20" width="200" height="36" rx="18" fill="#d9d9d9"/><text x="340" y="43" font-weight="600">Launch game</text>
<rect x="140" y="80" width="400" height="64" rx="8" fill="#cfe3f7"/><text x="340" y="104" font-weight="600">Main Menu</text><text x="340" y="126" font-size="12">New Game · Resume (saved) · Settings · How to Play · Quit</text>
<rect x="150" y="170" width="380" height="44" rx="8" fill="#cfe3f7"/><text x="340" y="190" font-weight="600">Forest – Day 1</text><text x="340" y="207" font-size="11.5">WASD move · Mouse look · Space jump · Shift sprint · Ctrl/C crouch · V camera</text>
<rect x="30" y="250" width="200" height="130" rx="8" fill="#d6efd2"/><text x="130" y="273" font-weight="600">1. Gather</text>
<text x="130" y="297" font-size="12">Press E on apples, rocks, logs</text><text x="130" y="317" font-size="12">Hold Left Mouse to chop trees</text><text x="130" y="337" font-size="12">Items go to inventory (I)</text><text x="130" y="357" font-size="12">G drops a held item</text>
<rect x="240" y="250" width="200" height="130" rx="8" fill="#fbe3c2"/><text x="340" y="273" font-weight="600">2. Survive</text>
<text x="340" y="297" font-size="12">Watch Health · Stamina</text><text x="340" y="317" font-size="12">Hunger and Thirst drain</text><text x="340" y="337" font-size="12">Eat / drink to refill them</text><text x="340" y="357" font-size="12">Hold E at campfire to light</text>
<rect x="450" y="250" width="200" height="130" rx="8" fill="#e6d9f3"/><text x="550" y="273" font-weight="600">3. Craft &amp; build</text>
<text x="550" y="297" font-size="12">B opens crafting</text><text x="550" y="317" font-size="12">E at workbench to use it</text><text x="550" y="337" font-size="12">1–9 picks hotbar slot</text><text x="550" y="357" font-size="12">R rotates a placed item</text>
<rect x="120" y="410" width="440" height="50" rx="8" fill="#f6d4d4"/><text x="340" y="432" font-weight="600">Food &amp; hunting</text><text x="340" y="450" font-size="12">Fish: click to cast, click to reel · Spear: aim, click to throw · avoid bear / boar</text>
<path d="M340 500L450 540L340 580L230 540Z" fill="#fff3b0"/><text x="340" y="537" font-weight="600">Day 1 tasks</text><text x="340" y="553" font-size="12">done?</text>
<text x="125" y="531" font-size="12" fill="#666">No – keep gathering</text>
<text x="352" y="600" font-size="12" text-anchor="start" fill="#666">Yes</text>
<text x="545" y="520" font-size="12">Needed: 3 apples</text><text x="545" y="538" font-size="12">5 logs · 3 stones</text>
<rect x="190" y="610" width="300" height="40" rx="8" fill="#d6efd2"/><text x="340" y="635" font-weight="600">“DAY 1 TASKS COMPLETE!”</text>
<rect x="190" y="672" width="300" height="36" rx="18" fill="#d9d9d9"/><text x="340" y="695" font-weight="600">Keep playing · Esc = Pause / Save</text>
</g>
</svg>
